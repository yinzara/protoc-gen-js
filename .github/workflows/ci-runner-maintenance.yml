name: CI runner maintenance

# Once a month, ask Gemini to check whether any GitHub-hosted runner label in
# publish.yml is deprecated or removed and, if so, open a PR applying the fix
# from .github/ci-runner-maintenance.md. Renovate handles plain label bumps;
# this covers the suffixed labels (-intel, -arm) and the structural
# test-native -> test-cross demotion that Renovate cannot do.
#
# Requires a GEMINI_API_KEY secret (Google AI Studio; free tier is fine).
#
# The PR is opened with the default GITHUB_TOKEN, which does not trigger the
# "Test and Publish" workflow via `pull_request`. The job instead dispatches
# that workflow onto the PR branch (workflow_dispatch IS allowed from
# GITHUB_TOKEN) and enables GitHub native auto-merge, so the PR merges itself
# once the required "all tests pass" check is green - and does nothing if it
# is not.
on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ci-runner-maintenance
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install deps (so post-install.js can be run for verification)
        run: npm ci --ignore-scripts
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ask Gemini to check and, if needed, fix runner labels
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Headless CI: mark the checkout as a trusted folder, otherwise the
          # Gemini CLI downgrades out of --yolo ("Approval mode overridden to
          # default because the current folder is not trusted") and can't run
          # any tool calls.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Model choice is about free-tier request budget, not capability: one
          # agentic pass makes many API calls, and a 3.x-or-newer *-flash-lite
          # model allows ~500 req/day free vs ~20/day for 2.5-flash-lite or
          # plain flash. This input is the only model knob we need - it exports
          # GEMINI_MODEL, which the CLI reads.
          gemini_model: gemini-3.5-flash-lite
          # Upload gemini-artifacts/{stdout,stderr,telemetry}.log so the full
          # transcript is downloadable from the run - on success the action
          # writes nothing to the step log.
          upload_artifacts: 'true'
          prompt: |-
            You maintain the CI runner labels AND this workflow's own Gemini
            model pin for this repository.

            1. Read .github/ci-runner-maintenance.md and follow it as the
               authoritative procedure. Also read .github/workflows/publish.yml
               and .github/workflows/ci-runner-maintenance.yml.
            2. Runner labels: decide whether any GitHub-hosted runner label used
               in publish.yml (in strategy.matrix.os lists, matrix.include rows,
               or runs-on:) has been removed or renamed. The authoritative
               signal is `gh`: use `gh run list`/`gh run view` on the last few
               "Test and Publish" runs - a gone label shows up as a matrix job
               that never starts or a run that fails immediately with a "no
               runner"/"label not found" error. Do not rely on web pages; if
               you have no other evidence, assume nothing changed. A transient
               outage is not a removal.
            3. Gemini model pin: only act here if a recent "CI runner
               maintenance" run (check with `gh`) failed at the "Run Gemini
               CLI" step with a model-not-found / deprecation error. If so,
               change the `gemini_model` value in
               .github/workflows/ci-runner-maintenance.yml to a current
               3.x-or-newer *-flash-lite model with a large free-tier
               requests-per-day limit (~500/day) - never 2.5-flash-lite
               (~20/day) or any flash / pro / ultra model. Otherwise leave it:
               this run working means the model is fine.
            4. If nothing needs changing, print "no change needed" and exit
               without creating a branch, commit, or PR.
            5. If a change is needed, apply the smallest fix on a new branch
               named ci/runner-maintenance-<YYYY-MM-DD>. For a runner-label
               change, verify locally exactly as the playbook says (for a
               demoted target: `PROTOC_GEN_JS_PLATFORM=<p>
               PROTOC_GEN_JS_ARCH=<a> node post-install.js` then
               `file bin/protoc-gen-js`, matching the `expect` regex). Commit
               and push the branch, then open one pull request against `main`
               with `gh pr create`, explaining what changed and why. Do not
               modify `main` directly. Do not reduce test coverage - a target
               may only move between matrices, never be dropped. Do not stage
               or commit `.gemini/`, `bin/`, `node_modules/` or generated
               `*_pb.js`. Do not add any AI/assistant session links to the
               commit message or PR body.
            6. Kick CI for the PR and let it merge itself on green:
               `gh workflow run "Test and Publish" --ref <branch>` then
               `gh pr merge --squash --auto <pr-number>`. Then stop - do not
               merge manually, do not wait; GitHub merges the PR once the
               required "all tests pass" check succeeds, or leaves it open if
               it fails.

      - name: Show Gemini's decision
        if: always()
        env:
          GEMINI_RESPONSE: ${{ steps.gemini.outputs.summary }}
          GEMINI_ERRORS: ${{ steps.gemini.outputs.error }}
        run: |
          echo "::group::Gemini response"
          printf '%s\n' "${GEMINI_RESPONSE:-(empty)}"
          echo "::endgroup::"
          {
            echo "### Gemini runner-maintenance decision"
            echo
            echo '```'
            printf '%s\n' "${GEMINI_RESPONSE:-(empty)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${GEMINI_ERRORS:-}" ]; then
            echo "::group::Gemini errors"
            printf '%s\n' "$GEMINI_ERRORS"
            echo "::endgroup::"
          fi
